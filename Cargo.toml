[package]
name = "scx_horoscope"
version = "0.2.0"
edition = "2021"
authors = ["Lucas Zampieri"]
license = "GPL-2.0-only"
description = "An astrological sched_ext scheduler - schedules tasks based on planetary positions"
repository = "https://github.com/zampierilucas/scx_horoscope"

[dependencies]
# sched_ext framework
scx_utils = "1.1.2"
scx_stats = "1.1.2"
scx_stats_derive = "1.1.2"
scx_rustland_core = "2.4"

# BPF and system interaction
libbpf-rs = "=0.26.2"
libc = "0.2"
plain = "0.2.3"

# Astronomy and astrology
astro = { git = "https://github.com/saurvs/astro-rust", rev = "c62ffdc7d55adfa1ee835fc7006d42d967bc4836" }
chrono = "0.4"

# CLI and configuration
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

# Logging
log = "0.4"
simplelog = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Signal handling
ctrlc = "3.5"

# Process info
procfs = "0.18"

[build-dependencies]
scx_utils = "1.1.2"
scx_rustland_core = "2.4.13"

[dev-dependencies]
# For testing
approx = "0.5"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"
